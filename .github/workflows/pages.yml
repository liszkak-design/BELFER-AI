name: Publikacja na GitHub Pages

# Wymaga ustawienia: Settings -> Pages -> Source: GitHub Actions
# Jesli wolisz "Deploy from a branch" (main, / root), ten plik nie jest potrzebny.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pobranie repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Pages
        uses: actions/configure-pages@v5

      - name: Spakowanie calego katalogu jako artefakt
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publikacja
        id: deployment
        uses: actions/deploy-pages@v4
